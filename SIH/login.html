<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Innovate360</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="auth-page">
    <!-- ================= NAVBAR ================= -->

    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
          <i class="bi bi-lightbulb-fill text-primary"></i>
          Innovate360
        </a>

        <a href="index.html" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i>
          Back to Home
        </a>
      </div>
    </nav>

    <!-- ================= LOGIN ================= -->

    <main class="auth-container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <div class="auth-icon">
            <i class="bi bi-person-fill"></i>
          </div>

          <h2 class="fw-bold mt-3">Welcome Back</h2>

          <p class="text-secondary">Sign in to continue to Innovate360</p>
        </div>

        <!-- ROLE SELECTION -->

        <div class="mb-4">
          <label class="form-label fw-semibold"> Login as </label>

          <div class="role-selection">
            <label class="role-option">
              <input type="radio" name="role" value="government" checked />

              <div class="role-content">
                <i class="bi bi-building"></i>

                <span>Government</span>
              </div>
            </label>

            <label class="role-option">
              <input type="radio" name="role" value="startup" />

              <div class="role-content">
                <i class="bi bi-rocket-takeoff"></i>

                <span>Startup</span>
              </div>
            </label>

            <label class="role-option">
              <input type="radio" name="role" value="admin" />

              <div class="role-content">
                <i class="bi bi-gear"></i>

                <span>Admin</span>
              </div>
            </label>
          </div>
        </div>

        <!-- EMAIL -->

        <div class="mb-3">
          <label class="form-label fw-semibold"> Email Address </label>

          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-envelope"></i>
            </span>

           <input
    type="email"
    id="email"
    class="form-control"
    placeholder="Enter your email"
    required
/>
          </div>
        </div>

        <!-- PASSWORD -->

        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label fw-semibold"> Password </label>

            <a href="#" class="small text-primary"> Forgot password? </a>
          </div>

          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>

            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              required
            />

            <button
              class="btn btn-outline-secondary"
              type="button"
              id="togglePassword"
            >
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <!-- REMEMBER -->

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe" />

          <label class="form-check-label" for="rememberMe"> Remember me </label>
        </div>

        <!-- LOGIN BUTTON -->

        <button
          type="button"
          class="btn btn-primary w-100 btn-lg"
          id="loginButton"
        >
          Sign In
          <i class="bi bi-arrow-right"></i>
        </button>

        <!-- REGISTER -->

        <div class="text-center mt-4">
          <p class="text-secondary mb-0">
            Don't have an account?

            <a href="register.html" class="text-primary fw-semibold">
              Create an account
            </a>
          </p>
        </div>
      </div>
    </main>

    <!-- <script src="js/script.js"></script> -->

        alert("LOGIN BUTTON IS WORKING!");
    });
</script> -->
<script src="js/script.js"></script>

<script>
document.getElementById("loginButton").addEventListener("click", function () {

    const email =
        document.getElementById("email")
            .value
            .trim()
            .toLowerCase();

    const password =
        document.getElementById("password")
            .value;

    const role =
        document.querySelector(
            'input[name="role"]:checked'
        ).value;


    /* =========================
       CHECK EMPTY FIELDS
       ========================= */

    if (email === "" || password === "") {

        alert("Please enter your email and password.");

        return;

    }


    /* =========================
       DEMO ACCOUNTS
       ========================= */

    const demoUsers = [

        {
            email: "startup@test.com",
            password: "123456",
            role: "startup",
            page: "startup/dashboard.html"
        },

        {
            email: "gov@test.com",
            password: "123456",
            role: "government",
            page: "government/dashboard.html"
        },

        {
            email: "admin@test.com",
            password: "123456",
            role: "admin",
            page: "admin/dashboard.html"
        }

    ];


    /* =========================
       CHECK DEMO USER
       ========================= */

    const demoUser =
        demoUsers.find(function (user) {

            return (
                user.email === email &&
                user.password === password &&
                user.role === role
            );

        });


    if (demoUser) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "userRole",
            role
        );

        localStorage.setItem(
            "userEmail",
            email
        );


        window.location.href =
            demoUser.page;

        return;

    }


    /* =========================
       CHECK REGISTERED USERS
       ========================= */

    const registeredUsers =
        JSON.parse(
            localStorage.getItem(
                "innovate360_users"
            )
        ) || [];


    const registeredUser =
        registeredUsers.find(function (user) {

            return (
                user.email === email &&
                user.password === password &&
                user.role === role
            );

        });


    if (registeredUser) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "userRole",
            registeredUser.role
        );

        localStorage.setItem(
            "userEmail",
            registeredUser.email
        );

        localStorage.setItem(
            "userName",
            registeredUser.name
        );


        let dashboard;


        if (registeredUser.role === "startup") {

            dashboard =
                "startup/dashboard.html";

        }

        else if (
            registeredUser.role === "government"
        ) {

            dashboard =
                "government/dashboard.html";

        }


        window.location.href =
            dashboard;

        return;

    }


    /* =========================
       INVALID LOGIN
       ========================= */

    alert(
        "Invalid email, password, or account type."
    );

});
</script>

  </body>
</html>
