<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | Innovate360</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Main CSS -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="auth-page">


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar bg-white border-bottom">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html">

                <i class="bi bi-lightbulb-fill text-primary"></i>

                Innovate360

            </a>


            <a
                href="index.html"
                class="btn btn-outline-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Home

            </a>

        </div>

    </nav>



    <!-- ================= REGISTER ================= -->

    <main class="auth-container">

        <div class="auth-card register-card">


            <!-- HEADER -->

            <div class="text-center mb-4">

                <div class="auth-icon">

                    <i class="bi bi-person-plus-fill"></i>

                </div>


                <h2 class="fw-bold mt-3">

                    Create Your Account

                </h2>


                <p class="text-secondary">

                    Join the Innovate360 innovation ecosystem

                </p>

            </div>



            <!-- ACCOUNT TYPE -->

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Account Type

                </label>


                <div class="role-selection">


                    <!-- <label class="role-option">

                        <input
                            type="radio"
                            name="accountType"
                            value="government"
                            checked>

                        <div class="role-content">

                            <i class="bi bi-building"></i>

                            <span>
                                Government
                            </span>

                        </div>

                    </label> -->



                    <label class="role-option">

                        <input
                            type="radio"
                            name="accountType"
                            value="startup">

                        <div class="role-content">

                            <i class="bi bi-rocket-takeoff"></i>

                            <span>
                                Startup
                            </span>

                        </div>

                    </label>


                </div>

            </div>



            <!-- NAME -->

            <div class="row">


                <div class="col-md-6 mb-3">

                    <label
                        class="form-label fw-semibold">

                        First Name

                    </label>


                    <input
                        type="text"
                        id="firstName"
                        class="form-control"
                        placeholder="First name">

                </div>



                <div class="col-md-6 mb-3">

                    <label
                        class="form-label fw-semibold">

                        Last Name

                    </label>


                    <input
                        type="text"
                        id="lastName"
                        class="form-control"
                        placeholder="Last name">

                </div>


            </div>



            <!-- EMAIL -->

            <div class="mb-3">

                <label
                    class="form-label fw-semibold">

                    Email Address

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope"></i>

                    </span>


                    <input
                        type="email"
                        id="registerEmail"
                        class="form-control"
                        placeholder="name@example.com">

                </div>

            </div>



            <!-- ORGANIZATION -->

            <div class="mb-3">

                <label
                    class="form-label fw-semibold">

                    Organization / Startup Name

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-building"></i>

                    </span>


                    <input
                        type="text"
                        id="organization"
                        class="form-control"
                        placeholder="Enter organization name">

                </div>

            </div>



            <!-- PHONE -->

            <div class="mb-3">

                <label
                    class="form-label fw-semibold">

                    Phone Number

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        +91

                    </span>


                    <input
                        type="tel"
                        id="phone"
                        class="form-control"
                        placeholder="10-digit mobile number">

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    class="form-label fw-semibold">

                    Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        id="registerPassword"
                        class="form-control"
                        placeholder="Create a password">


                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="toggleRegisterPassword">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>



            <!-- CONFIRM PASSWORD -->

            <div class="mb-3">

                <label
                    class="form-label fw-semibold">

                    Confirm Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock-fill"></i>

                    </span>


                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password">

                </div>

            </div>



            <!-- TERMS -->

            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="terms">


                <label
                    class="form-check-label small"
                    for="terms">

                    I agree to the

                    <a
                        href="#"
                        class="text-primary">

                        Terms & Conditions

                    </a>

                    and

                    <a
                        href="#"
                        class="text-primary">

                        Privacy Policy

                    </a>.

                </label>

            </div>



            <!-- REGISTER BUTTON -->

            <button
                type="button"
                class="btn btn-primary btn-lg w-100"
                id="registerButton">

                Create Account

                <i class="bi bi-arrow-right"></i>

            </button>



            <!-- LOGIN -->

            <div class="text-center mt-4">

                <p class="text-secondary mb-0">

                    Already have an account?

                    <a
                        href="login.html"
                        class="text-primary fw-semibold">

                        Sign in

                    </a>

                </p>

            </div>


        </div>

    </main>



    <!-- Existing JS -->

    <script src="js/script.js"></script>



    <!-- ================= REGISTER FUNCTION ================= -->

    <script>

        const registerButton =
            document.getElementById(
                "registerButton"
            );


        registerButton.addEventListener(
            "click",
            function () {


                /* GET VALUES */

                const firstName =
                    document.getElementById(
                        "firstName"
                    ).value.trim();


                const lastName =
                    document.getElementById(
                        "lastName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "registerEmail"
                    ).value.trim().toLowerCase();


                const organization =
                    document.getElementById(
                        "organization"
                    ).value.trim();


                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "registerPassword"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                const terms =
                    document.getElementById(
                        "terms"
                    ).checked;


              const role = "startup";
                /* VALIDATION */

                if (
                    firstName === "" ||
                    lastName === "" ||
                    email === "" ||
                    organization === "" ||
                    phone === "" ||
                    password === "" ||
                    confirmPassword === ""
                ) {

                    alert(
                        "Please fill in all required fields."
                    );

                    return;

                }


                if (!terms) {

                    alert(
                        "Please accept the Terms & Conditions."
                    );

                    return;

                }


                if (
                    password.length < 6
                ) {

                    alert(
                        "Password must contain at least 6 characters."
                    );

                    return;

                }


                if (
                    password !== confirmPassword
                ) {

                    alert(
                        "Passwords do not match."
                    );

                    return;

                }


                /* GET EXISTING USERS */

                let users =
                    JSON.parse(
                        localStorage.getItem(
                            "innovate360_users"
                        )
                    ) || [];


                /* CHECK EMAIL */

                const existingUser =
                    users.find(
                        function (user) {

                            return (
                                user.email === email
                            );

                        }
                    );


                if (existingUser) {

                    alert(
                        "An account with this email already exists."
                    );

                    return;

                }


                /* CREATE ACCOUNT */

                const newUser = {

                    firstName:
                        firstName,

                    lastName:
                        lastName,

                    name:
                        firstName +
                        " " +
                        lastName,

                    email:
                        email,

                    organization:
                        organization,

                    phone:
                        phone,

                    password:
                        password,

                    role:
                        role

                };


                /* SAVE */

                users.push(
                    newUser
                );


                localStorage.setItem(
                    "innovate360_users",
                    JSON.stringify(users)
                );


                /* SUCCESS */

                alert(
                    "Account created successfully!"
                );


                /* GO TO LOGIN */

                window.location.href =
                    "login.html";


            }
        );


        /* PASSWORD TOGGLE */

        const toggleRegisterPassword =
            document.getElementById(
                "toggleRegisterPassword"
            );


        toggleRegisterPassword.addEventListener(
            "click",
            function () {


                const password =
                    document.getElementById(
                        "registerPassword"
                    );


                const icon =
                    toggleRegisterPassword
                        .querySelector("i");


                if (
                    password.type ===
                    "password"
                ) {

                    password.type =
                        "text";


                    icon.classList.remove(
                        "bi-eye"
                    );


                    icon.classList.add(
                        "bi-eye-slash"
                    );

                }

                else {

                    password.type =
                        "password";


                    icon.classList.remove(
                        "bi-eye-slash"
                    );


                    icon.classList.add(
                        "bi-eye"
                    );

                }

            }
        );

    </script>


</body>

</html>
